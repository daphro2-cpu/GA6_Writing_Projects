<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="GA6 Writing Projects: an interactive teaching studio with textbook pages, research resources and a classroom annotation board."><title>GA6 • Writing Projects</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="#home"><img class="ga6-logo" src="assets/ga6-logo.png" alt="GA6"><span>GIRAFFE ACADEMY<small>Writing Projects</small></span></a><div class="header-right"><span class="savebadge" id="saveStatus">Saved on this browser</span><button onclick="showHelp()">Teacher guide</button><button onclick="exportWork()">Save backup</button><label class="button">Restore<input type="file" accept=".json" hidden onchange="importWork(this)"></label></div></header>
<div id="home"></div><div id="studio" hidden>
<aside class="sidebar"><a class="back" href="#home">All writing projects</a><p class="eyebrow">WRITING PROJECT 03</p><h2>Wheels at work</h2><nav id="nav" aria-label="Lesson activities"></nav><a class="resource-link" href="wheel-pack.pdf" target="_blank">Print resource pack</a><p class="small">English only · Book pp. 16–21</p></aside>
<main><div class="stagebar"><div><span class="eyebrow" id="stageTag"></span><h2 id="stageTitle"></h2></div><div class="view-buttons"><button id="showLesson" onclick="setView('lesson')">Activity only</button><button id="showBoth" onclick="setView('both')">Split view</button><button id="showBook" onclick="setView('book')">Textbook only</button></div></div>
<div class="toolbar" aria-label="Classroom annotation tools"><strong>Classroom board</strong><div id="tools"></div><label>Colour <input id="color" type="color" value="#833ac1" aria-label="Custom drawing colour"></label><div id="swatches"></div><label>Size <select id="penSize"><option value="3">Fine</option><option value="6" selected>Medium</option><option value="12">Bold</option></select></label><button onclick="undoInk()">Undo</button><button onclick="clearInk()">Clear page</button><select id="inkTarget" aria-label="Page to undo or clear"><option value="lesson">Activity marks</option><option value="book">Book marks</option></select></div>
<div class="workspace" id="workspace"><section class="pane" id="lessonPane"><div class="panehead"><span>LEARN • TALK • WRITE</span><button onclick="setView('book')" title="Close activity pane">Close activity ×</button></div><div class="scrollpane"><div class="board" id="lessonBoard"><div id="lessonContent"></div><svg class="ink" id="lessonInk"></svg></div></div></section><section class="pane" id="bookPane"><div class="panehead"><label>Textbook <select id="bookSelect" onchange="changeBook(+this.value)"></select></label><button onclick="setView('lesson')">Close textbook ×</button></div><div class="scrollpane"><div class="board" id="bookBoard"><img id="bookImage" alt="Corresponding textbook page"><svg class="ink" id="bookInk"></svg></div></div></section></div>
<footer><button id="prev" onclick="navigate(-1)">Previous activity</button><span id="progress"></span><button class="primary" id="next" onclick="navigate(1)">Next activity</button></footer></main></div>
<dialog id="modal"><button class="modalclose" onclick="document.querySelector('#modal').close()">Close ×</button><div id="modalContent"></div></dialog>
<script src="data.js"></script><script src="art.js"></script><script src="photos.js"></script><script src="app.js"></script></body></html>
